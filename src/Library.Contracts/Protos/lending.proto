syntax = "proto3";

package library.v1;

option csharp_namespace = "Library.Contracts.V1";

import "google/protobuf/timestamp.proto";

service LendingService {
  rpc AddBook     (AddBookRequest)     returns (Book);
  rpc GetBook     (GetBookRequest)     returns (Book);
  rpc ListBooks   (ListBooksRequest)   returns (ListBooksResponse);
  rpc AddBorrower (AddBorrowerRequest) returns (Borrower);
  rpc GetBorrower (GetBorrowerRequest) returns (Borrower);
  rpc BorrowBook  (BorrowBookRequest)  returns (Loan);
  rpc ReturnBook  (ReturnBookRequest)  returns (Loan);
  rpc GetLoan     (GetLoanRequest)     returns (Loan);
}

message Book {
  int32  id = 1;
  string title = 2;
  string author = 3;
  int32  page_count = 4;
  int32  total_copies = 5;      // derived on read
  int32  available_copies = 6;  // derived on read: copies with no open loan
}

message AddBookRequest   { string title = 1; string author = 2; int32 page_count = 3; int32 copies = 4; }
message GetBookRequest   { int32 book_id = 1; }
message ListBooksRequest {}                       // whole catalogue, ordered by id
message ListBooksResponse { repeated Book books = 1; }

message Borrower { int32 id = 1; string full_name = 2; string email = 3; }
message AddBorrowerRequest { string full_name = 1; string email = 2; }
message GetBorrowerRequest { int32 borrower_id = 1; }

message Loan {
  int32  id = 1;
  int32  book_id = 2;
  string book_title = 3;
  int32  borrower_id = 4;
  string borrower_name = 5;
  google.protobuf.Timestamp borrowed_at = 6;
  google.protobuf.Timestamp due_at = 7;
  google.protobuf.Timestamp returned_at = 8;  // message type: unset means still out
}

message BorrowBookRequest { int32 borrower_id = 1; int32 book_id = 2; }
message ReturnBookRequest { int32 loan_id = 1; }
message GetLoanRequest    { int32 loan_id = 1; }
