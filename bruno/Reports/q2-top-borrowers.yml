info:
  name: Q2 Top borrowers in a time frame
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/borrowers/top?from=2026-01-01&to=2026-04-01&limit=5"
  params:
    - name: from
      value: 2026-01-01
      type: query
    - name: to
      value: 2026-04-01
      type: query
    - name: limit
      value: "5"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.borrowers[0].fullName
      operator: eq
      value: Ava Chen
    - expression: res.body.borrowers[0].loanCount
      operator: eq
      value: "6"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Q2 — who borrowed the most in a time frame.** Unlike Q1 the window is required here;
  omitting it is a 400, which **Errors** covers.

  Expect Ava Chen first at 6 loans across 5 distinct titles.
