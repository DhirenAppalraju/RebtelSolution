info:
  name: Q2 with the upper bound moved one day
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/borrowers/top?from=2026-01-01&to=2026-04-02&limit=5"
  params:
    - name: from
      value: 2026-01-01
      type: query
    - name: to
      value: 2026-04-02
      type: query
    - name: limit
      value: "5"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.borrowers[2].fullName
      operator: eq
      value: Elena Rossi
    - expression: res.body.borrowers[2].distinctTitles
      operator: eq
      value: "4"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `to` moves from 1 April to 2 April and Elena Rossi's loan of 1 April comes into the
  half-open window: she rises to 4 loans across 4 titles and overtakes Dmitri Volkov,
  who also has 4 loans but across 3 titles.

  The clearest demonstration that the boundary is exclusive.
