info:
  name: Q1 Most borrowed books
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/books/most-borrowed?limit=5"
  params:
    - name: limit
      value: "5"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.books[0].bookId
      operator: eq
      value: "1"
    - expression: res.body.books[0].distinctBorrowers
      operator: eq
      value: "6"
    - expression: res.body.books[1].bookId
      operator: eq
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Q1 — which books are borrowed most.** All time, no window.

  Expect The Hobbit first at 6 loans from 6 distinct borrowers, then Dune at 6 from 5.
  Two counts, because one keen borrower is not the same thing as broad demand.
