info:
  name: Q3 over a window
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/borrowers/1/reading-pace?from=2026-01-01&to=2026-01-12"
  params:
    - name: from
      value: 2026-01-01
      type: query
    - name: to
      value: 2026-01-12
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.pagesPerDay
      operator: eq
      value: "82"
    - expression: res.body.completedLoans
      operator: eq
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Ava Chen in January: two loans that overlap in time, 820 pages over 10 days, 82 per day.

  The overlap is not netted out — days are summed per loan. Reading two books at once
  therefore reads as a slower pace, which is the honest answer to "how long does a book
  take her" and the wrong one for "how many pages does she read a day". Deliberate, and
  written down in the README.
