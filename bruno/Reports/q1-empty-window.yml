info:
  name: Q1 with empty window values
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/books/most-borrowed?from=&to="
  params:
    - name: from
      value: ""
      type: query
    - name: to
      value: ""
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.books[0].bookId
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  An empty value means "absent", not "invalid", so this is the all-time report again
  rather than a 400. Worth keeping because a UI that binds empty form fields sends
  exactly this.
