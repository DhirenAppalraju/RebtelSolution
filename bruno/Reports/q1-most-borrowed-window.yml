info:
  name: Q1 in a time window
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/books/most-borrowed?from=2026-01-01&to=2026-02-01"
  params:
    - name: from
      value: 2026-01-01
      type: query
    - name: to
      value: 2026-02-01
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.books[0].borrowCount
      operator: eq
      value: "4"
    - expression: res.body.books[1].borrowCount
      operator: eq
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The same report over January only. The window is half-open, `[from, to)`, so a loan
  taken on 1 February is out.

  Expect The Hobbit 4/4 and Dune narrowed to 3/3.
