info:
  name: One borrower
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/borrowers/3"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.fullName
      operator: eq
      value: Clara Diaz

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Clara Diaz, the borrower used by the reading-pace report in **Reports**.
