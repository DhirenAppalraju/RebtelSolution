info:
  name: Q2 without its window is 400
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/borrowers/top"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.title
      operator: eq
      value: Missing time window

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `from` and `to` are required on Q2, and the API rejects this before any gRPC call is
  made: a request that cannot succeed should not cost a network hop.

  The detail names the format and says the window is half-open.
