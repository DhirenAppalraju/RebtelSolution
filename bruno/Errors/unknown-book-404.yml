info:
  name: An unknown id is 404
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/books/999"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.detail
      operator: eq
      value: Book 999 was not found.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `404` with a problem document that names the id it looked for. Unmatched routes get a
  problem document too, rather than an empty body.
